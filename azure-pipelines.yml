# Docker
# Build a Docker image 
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- master

resources:
- repo: self

variables:
  tag: '$(Build.BuildNumber)'
  dockerHubNamespace: 'diablinux'
  imageName: 'hello-k8s'

stages:
- stage: Build
  displayName: Build image
  jobs:  
  - job: Build
    displayName: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push image
      inputs:
        containerRegistry: 'DockerHub-Connection'
        repository: '$(dockerHubNamespace)/$(imageName)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
          latest

    - script: |
        set -euo pipefail
        docker buildx imagetools inspect docker.io/$(dockerHubNamespace)/$(imageName):$(tag)
        docker buildx imagetools inspect docker.io/$(dockerHubNamespace)/$(imageName):latest
      displayName: Verify image tags exist on Docker Hub